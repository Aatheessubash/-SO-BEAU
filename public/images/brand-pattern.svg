<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <style>
      .bg { fill: #1B3B2B; }
      .letter { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 600; fill: #FDFBF7; }
      .star-gold { fill: #C5A059; }
      .star-mini { fill: #C5A059; opacity: 0.85; }
    </style>
  </defs>

  <!-- Deep Forest Green Canvas -->
  <rect width="120" height="120" class="bg" />

  <!-- Center 'S' and Star -->
  <text x="56" y="74" class="letter" text-anchor="middle">S</text>
  <path d="M 74 44 C 74.5 47 75.5 48 78.5 48.5 C 75.5 49 74.5 50 74 53 C 73.5 50 72.5 49 69.5 48.5 C 72.5 48 73.5 47 74 44 Z" class="star-gold" />

  <!-- Corner 'S' for seamless tile -->
  <!-- Top Left -->
  <text x="-4" y="14" class="letter" text-anchor="middle">S</text>
  <path d="M 14 -16 C 14.5 -13 15.5 -12 18.5 -11.5 C 15.5 -11 14.5 -10 14 -7 C 13.5 -10 12.5 -11 9.5 -11.5 C 12.5 -12 13.5 -13 14 -16 Z" class="star-gold" />
  
  <!-- Top Right -->
  <text x="116" y="14" class="letter" text-anchor="middle">S</text>
  <path d="M 134 -16 C 134.5 -13 135.5 -12 138.5 -11.5 C 135.5 -11 134.5 -10 134 -7 C 133.5 -10 132.5 -11 129.5 -11.5 C 132.5 -12 133.5 -13 134 -16 Z" class="star-gold" />

  <!-- Bottom Left -->
  <text x="-4" y="134" class="letter" text-anchor="middle">S</text>
  <path d="M 14 104 C 14.5 107 15.5 108 18.5 108.5 C 15.5 109 14.5 110 14 113 C 13.5 110 12.5 109 9.5 108.5 C 12.5 108 13.5 107 14 104 Z" class="star-gold" />

  <!-- Bottom Right -->
  <text x="116" y="134" class="letter" text-anchor="middle">S</text>
  <path d="M 134 104 C 134.5 107 135.5 108 138.5 108.5 C 135.5 109 134.5 110 134 113 C 133.5 110 132.5 109 129.5 108.5 C 132.5 108 133.5 107 134 104 Z" class="star-gold" />

  <!-- Interstitial Diamond Sparkles in the Negative Spaces -->
  <path d="M 60 10 C 60.3 12 61 12.7 63 13 C 61 13.3 60.3 14 60 16 C 59.7 14 59 13.3 57 13 C 59 12.7 59.7 12 60 10 Z" class="star-mini" />
  <path d="M 60 110 C 60.3 112 61 112.7 63 113 C 61 113.3 60.3 114 60 116 C 59.7 114 59 113.3 57 113 C 59 112.7 59.7 112 60 110 Z" class="star-mini" />
  <path d="M 10 60 C 10.3 62 11 62.7 13 63 C 11 63.3 10.3 64 10 66 C 9.7 64 9 63.3 7 63 C 9 62.7 9.7 62 10 60 Z" class="star-mini" />
  <path d="M 110 60 C 110.3 62 111 62.7 113 63 C 111 63.3 110.3 64 110 66 C 109.7 64 109 63.3 107 63 C 109 62.7 109.7 62 110 60 Z" class="star-mini" />
</svg>
